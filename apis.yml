name: Dtex Systems
description: >-
  DTEX Systems (dtex.ai) is a risk-adaptive cybersecurity company delivering an
  enterprise Insider Risk Management platform that unifies human, data, and AI
  risk through behavioral intelligence. Its InTERCEPT platform combines
  lightweight endpoint telemetry, user activity monitoring, and data loss
  prevention with privacy-by-design pseudonymization to detect insider threats
  and prevent data breaches early. DTEX Platform v7 adds OCSF-aligned,
  cloud-to-cloud connectors and autonomous "agentic defender" AI agents (Triage
  Guardian, Threat Hunter) that investigate incidents, while the company's i3
  investigative division provides expert insider-threat research. DTEX integrates
  with SIEM, SOAR, EDR, IdP, and productivity tools (Splunk, CrowdStrike,
  Microsoft 365, Netskope, Google Workspace) rather than exposing a public
  developer API. Backed by Wing Venture Capital.
